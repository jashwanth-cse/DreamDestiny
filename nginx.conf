# ==============================================================================
# DREAM DESTINY — PRODUCTION NGINX REVERSE PROXY CONFIGURATION (SSL / TLS)
# ==============================================================================
# Acts as the single entry-point API Gateway for all 7 microservices.
# Exposes Port 80 (HTTP redirect to HTTPS) and Port 443 (HTTPS with Let's Encrypt).
# ==============================================================================

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # ── MIME Types & File Handling ───────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 75;
    types_hash_max_size 2048;

    # ── Gzip Compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;

    # ── Security & Hardening Headers ─────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Rate Limiting ────────────────────────────────────────────────────────
    # 30 requests per second per IP with a burst buffer of 50
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_status 429;

    # ── Upstream Microservices ───────────────────────────────────────────────
    # Resolves directly via Docker's internal DNS engine
    upstream planner_service {
        server planner-service:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream tourism_service {
        server tourism-service:8001 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream hotel_service {
        server hotel-service:8002 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream route_service {
        server route-service:8003 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream bus_service {
        server bus-service:8004 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream train_service {
        server train-service:8005 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream flight_service {
        server flight-service:8006 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ── 1. HTTP Server (Redirect all traffic to HTTPS, keep ACME challenge) ──
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Let's Encrypt ACME HTTP-01 Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Internal container healthcheck probe (keeps Docker healthcheck green)
        location = /health {
            access_log off;
            return 200 '{"status":"healthy","service":"dream-destiny-gateway","version":"2.0"}\n';
            add_header Content-Type application/json;
        }

        # Redirect all external HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── 2. HTTPS Secure Server ───────────────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name dreamdestiny.duckdns.org;

        client_max_body_size 10M;

        # SSL Certificates (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/dreamdestiny.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dreamdestiny.duckdns.org/privkey.pem;

        # Modern SSL Configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Standard Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Timeouts: Allow up to 90s for LLM planning inference
        proxy_connect_timeout 90s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;

        # Apply general rate limit
        limit_req zone=api_limit burst=50 nodelay;

        # ── Health Check Endpoints (Zero external API calls, sub-millisecond) ─
        location = /health {
            access_log off;
            return 200 '{"status":"healthy","service":"dream-destiny-gateway","version":"2.0","ssl":true}\n';
            add_header Content-Type application/json;
        }

        location = /plan/health {
            proxy_pass http://planner_service/health;
        }

        location = /tourism/health {
            proxy_pass http://tourism_service/health;
        }

        location = /hotels/health {
            proxy_pass http://hotel_service/health;
        }

        location = /route/health {
            proxy_pass http://route_service/health;
        }

        location = /api/v1/buses/health {
            proxy_pass http://bus_service/health;
        }

        location = /api/v1/trains/health {
            proxy_pass http://train_service/health;
        }

        location = /flights/health {
            proxy_pass http://flight_service/health;
        }

        # ── 2. Planner & Orchestration Service ───────────────────────────────
        location /plan {
            proxy_pass http://planner_service;
        }

        # ── 3. Tourism Service ───────────────────────────────────────────────
        location /tourism {
            proxy_pass http://tourism_service;
        }

        # ── 4. Hotel Service ─────────────────────────────────────────────────
        location /hotels {
            proxy_pass http://hotel_service;
        }

        # ── 5. Route Service ─────────────────────────────────────────────────
        location /route {
            proxy_pass http://route_service;
        }

        # ── 6. Bus Transport Service ─────────────────────────────────────────
        location /api/v1/buses {
            proxy_pass http://bus_service;
        }

        # ── 7. Train Transport Service ───────────────────────────────────────
        location /api/v1/trains {
            proxy_pass http://train_service;
        }

        # ── 8. Flight Transport Service ──────────────────────────────────────
        location /flights {
            proxy_pass http://flight_service;
        }

        # ── Default 404 handler ──────────────────────────────────────────────
        location / {
            return 404 '{"error":"Endpoint not found","message":"Refer to Dream Destiny API documentation for valid paths."}\n';
            add_header Content-Type application/json;
        }
    }
}
