name: Continuous Deployment to AWS EC2

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'docs/**'

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to AWS EC2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e
            echo "=========================================================="
            echo "[CI/CD] Starting automated deployment on EC2..."
            echo "=========================================================="
            cd /opt/dream-destiny
            sudo chown -R "$USER:$USER" /opt/dream-destiny

            echo "[1/4] Pulling latest changes from GitHub main branch..."
            git fetch origin main
            git reset --hard origin/main

            echo "[2/5] Rebuilding and waiting for containers to become healthy..."
            docker compose -f docker-compose.prod.yml up -d --build --wait --remove-orphans

            echo "[3/5] Refreshing gateway to bind updated configuration and resolve container IPs..."
            docker compose -f docker-compose.prod.yml restart gateway
            sleep 3

            echo "[4/5] Pruning dangling Docker build caches..."
            docker image prune -f

            echo "[5/5] Verifying all service health probes through reverse proxy..."
            python3 deploy/verify_deployment.py http://localhost

            echo "=========================================================="
            echo "[CI/CD] Deployment successfully verified and completed!"
            echo "=========================================================="
          EOF
