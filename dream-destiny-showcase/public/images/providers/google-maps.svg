    <path d="M12.98 0C5.81 0 0 5.81 0 12.98c0 2.27.59 4.41 1.62 6.27L7.23 7.82A8.13 8.13 0 0 1 12.98 4.88c2.25 0 4.3.91 5.75 2.37l5.61-5.61A12.91 12.91 0 0 0 12.98 0z" fill="#EA4335"/>
