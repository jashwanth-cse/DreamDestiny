  <circle cx="180" cy="205" r="8" fill="#0B2345" opacity="0.7"/>
  <circle cx="300" cy="215" r="8" fill="#0B2345" opacity="0.7"/>
  <circle cx="480" cy="245" r="8" fill="#0B2345" opacity="0.7"/>
