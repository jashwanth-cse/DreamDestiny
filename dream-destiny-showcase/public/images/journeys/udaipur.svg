  <path d="M100 370C180 368 240 374 340 370S460 366 540 370S660 374 740 370" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <path d="M20 410C140 408 220 414 320 410S440 406 580 410S700 414 780 410" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.2"/>
