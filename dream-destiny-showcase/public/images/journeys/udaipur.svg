      <stop offset="0%" stop-color="#E4EDEF"/>
      <stop offset="70%" stop-color="#FCEEE6"/>
      <stop offset="100%" stop-color="#F9D7C2"/>
    </linearGradient>
    <linearGradient id="waterUdaipur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A5C3C8"/>
      <stop offset="100%" stop-color="#769FA6"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
