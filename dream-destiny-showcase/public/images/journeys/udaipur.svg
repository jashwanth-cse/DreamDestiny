  <path d="M565 348V360" stroke="#0D0F10" stroke-width="2"/>
  <!-- Badge: Replaceable Placeholder -->
  <rect x="24" y="24" width="230" height="32" rx="16" fill="#0B2345" fill-opacity="0.85"/>
  <text x="36" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" letter-spacing="0.04em">UDAIPUR • HERITAGE</text>
