# ==============================================================================
# DREAM DESTINY — PRODUCTION DOCKER COMPOSE CONFIGURATION
# ==============================================================================
# Architecture:
#   - Single public entry point via NGINX reverse proxy (Port 80/443).
#   - All 7 microservices run in an isolated internal Docker bridge network.
#   - Zero exposed microservice host ports for maximum security.
#   - Memory caps tuned specifically for AWS Free Tier (1GB RAM + 3GB Swap).
# ==============================================================================

version: "3.8"

networks:
  dream-destiny-prod-net:
    driver: bridge

volumes:
  hotel-cache-data:
    driver: local

services:
  # ── 1. API Gateway / Reverse Proxy ──────────────────────────────────────────
  gateway:
    image: nginx:1.27-alpine
    container_name: dream-destiny-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - dream-destiny-prod-net
    depends_on:
      planner-service:
        condition: service_healthy
      train-service:
        condition: service_healthy
      flight-service:
        condition: service_healthy
      tourism-service:
        condition: service_healthy
      hotel-service:
        condition: service_healthy
      route-service:
        condition: service_healthy
      bus-service:
        condition: service_healthy
      whatsapp-bot-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── 2. Tourism Service ──────────────────────────────────────────────────────
  tourism-service:
    build:
      context: ./tourism-service
      dockerfile: Dockerfile
    container_name: dream-destiny-tourism
    restart: always
    environment:
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
    networks:
      - dream-destiny-prod-net
    deploy:
      resources:
        limits:
          memory: 150M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── 3. Hotel Service ────────────────────────────────────────────────────────
  hotel-service:
    build:
      context: ./hotel-service
      dockerfile: Dockerfile
    container_name: dream-destiny-hotel
    restart: always
    environment:
      - SERPAPI_API_KEY=${SERPAPI_API_KEY}
      - HOTEL_CACHE_TTL_HOURS=${HOTEL_CACHE_TTL_HOURS:-24}
      - HOTEL_DB_PATH=/app/data/hotel_cache.db
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-*}
    volumes:
      - hotel-cache-data:/app/data
    networks:
      - dream-destiny-prod-net
    deploy:
      resources:
        limits:
          memory: 150M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── 4. Route Service ────────────────────────────────────────────────────────
  route-service:
    build:
      context: ./route-service
      dockerfile: Dockerfile
    container_name: dream-destiny-route
    restart: always
    environment:
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-*}
    networks:
      - dream-destiny-prod-net
    deploy:
      resources:
        limits:
          memory: 150M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── 5. Bus Transport Service ────────────────────────────────────────────────
  bus-service:
    build:
      context: ./transport-service/bus
      dockerfile: Dockerfile
    container_name: dream-destiny-bus
    restart: always
    networks:
      - dream-destiny-prod-net
    deploy:
      resources:
        limits:
          memory: 150M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── 6. Train Transport Service ──────────────────────────────────────────────
  train-service:
    build:
      context: ./transport-service/train
      dockerfile: Dockerfile
    container_name: dream-destiny-train
    restart: always
    volumes:
      - ./data:/app/data:ro
    environment:
      - RAILWAY_STATIONS_DATA_PATH=/app/data/railway_stations.json
      - DIVISION_HUBS_DATA_PATH=/app/data/division_hubs.json
      - STATE_CAPITALS_DATA_PATH=/app/data/state_capitals.json
      - STATION_ALIASES_DATA_PATH=/app/data/station_aliases.json
    networks:
      - dream-destiny-prod-net
    deploy:
      resources:
        limits:
          memory: 200M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── 7. Flight Transport Service ─────────────────────────────────────────────
  flight-service:
    build:
      context: ./transport-service/flight
      dockerfile: Dockerfile
    container_name: dream-destiny-flight
    restart: always
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - SERPAPI_API_KEY=${SERPAPI_API_KEY}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - HTTP_TIMEOUT=${HTTP_TIMEOUT:-30.0}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-*}
      - MAX_AIRPORT_RADIUS_KM=${MAX_AIRPORT_RADIUS_KM:-500}
      - GEOCODING_CACHE_TTL=${GEOCODING_CACHE_TTL:-86400}
    networks:
      - dream-destiny-prod-net
    deploy:
      resources:
        limits:
          memory: 180M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── 8. Planner & AI Orchestration Service ────────────────────────────────────
  planner-service:
    build:
      context: ./planner-service
      dockerfile: Dockerfile
    container_name: dream-destiny-planner
    restart: always
    environment:
      - TOURISM_SERVICE_URL=http://tourism-service:8001
      - HOTEL_SERVICE_URL=http://hotel-service:8002
      - ROUTE_SERVICE_URL=http://route-service:8003
      - TRANSPORT_BUS_SERVICE_URL=http://bus-service:8004
      - TRANSPORT_TRAIN_SERVICE_URL=http://train-service:8005
      - TRANSPORT_FLIGHT_SERVICE_URL=http://flight-service:8006
      - FLIGHT_SERVICE_URL=http://flight-service:8006
      - BEDROCK_API_KEY=${BEDROCK_API_KEY}
      - HTTP_TIMEOUT=${HTTP_TIMEOUT:-20.0}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-60.0}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-*}
    depends_on:
      tourism-service:
        condition: service_healthy
      hotel-service:
        condition: service_healthy
      route-service:
        condition: service_healthy
      bus-service:
        condition: service_healthy
      train-service:
        condition: service_healthy
      flight-service:
        condition: service_healthy
    networks:
      - dream-destiny-prod-net
    deploy:
      resources:
        limits:
          memory: 250M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── 9. Certbot SSL Auto-Renewal ─────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: dream-destiny-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  # ── 10. Redis Cache & Distributed Lock ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dream-destiny-redis
    restart: always
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    networks:
      - dream-destiny-prod-net
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 2s

  # ── 11. WhatsApp Bot Conversational Service ─────────────────────────────────
  whatsapp-bot-service:
    build:
      context: ./whatsapp-bot-service
      dockerfile: Dockerfile
    container_name: dream-destiny-whatsapp-bot
    restart: always
    environment:
      - APP_ENV=production
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN:-}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-dream_destiny_verify_token}
      - WHATSAPP_API_VERSION=${WHATSAPP_API_VERSION:-v20.0}
      - REDIS_URL=redis://redis:6379/0
      - PLANNER_GATEWAY_URL=http://planner-service:8000
      - BEDROCK_API_KEY=${BEDROCK_API_KEY:-}
    networks:
      - dream-destiny-prod-net
    depends_on:
      redis:
        condition: service_healthy
      planner-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 150M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # 📈 12. Dozzle Log Viewer 📈
  dozzle:
    image: amir20/dozzle:latest
    container_name: dream-destiny-dozzle
    restart: unless-stopped
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_LEVEL=info
      - DOZZLE_TAILSIZE=300
      - DOZZLE_USERNAME=${DOZZLE_USERNAME:-admin}
      - DOZZLE_PASSWORD=${DOZZLE_PASSWORD:-dreamlogs123}
    networks:
      - dream-destiny-prod-net
    deploy:
      resources:
        limits:
          memory: 64M
