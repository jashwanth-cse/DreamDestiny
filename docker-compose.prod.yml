# ==============================================================================
# DREAM DESTINY — PRODUCTION DOCKER COMPOSE CONFIGURATION
# ==============================================================================
# Architecture:
#   - Single public entry point via NGINX reverse proxy (Port 80/443).
#   - All 7 microservices run in an isolated internal Docker bridge network.
#   - Zero exposed microservice host ports for maximum security.
#   - Memory caps tuned specifically for AWS Free Tier (1GB RAM + 3GB Swap).
# ==============================================================================

version: "3.8"

networks:
  dream-destiny-prod-net:
    driver: bridge

volumes:
  hotel-cache-data:
    driver: local

services:
  # ── 1. API Gateway / Reverse Proxy ──────────────────────────────────────────
  gateway:
    image: nginx:1.27-alpine
    container_name: dream-destiny-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - dream-destiny-prod-net
    depends_on:
      planner-service:
        condition: service_healthy
      train-service:
        condition: service_healthy
      flight-service:
        condition: service_healthy
      tourism-service:
        condition: service_healthy
      hotel-service:
        condition: service_healthy
      route-service:
        condition: service_healthy
      bus-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── 2. Tourism Service ──────────────────────────────────────────────────────
  tourism-service:
    build:
      context: ./tourism-service
      dockerfile: Dockerfile
    container_name: dream-destiny-tourism
    restart: always
    environment:
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
    networks:
      - dream-destiny-prod-net
    deploy:
      resources:
        limits:
          memory: 150M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── 3. Hotel Service ────────────────────────────────────────────────────────
  hotel-service:
    build:
      context: ./hotel-service
      dockerfile: Dockerfile
    container_name: dream-destiny-hotel
    restart: always
    environment:
      - SERPAPI_API_KEY=${SERPAPI_API_KEY}
      - HOTEL_CACHE_TTL_HOURS=${HOTEL_CACHE_TTL_HOURS:-24}
      - HOTEL_DB_PATH=/app/data/hotel_cache.db
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-*}
    volumes:
      - hotel-cache-data:/app/data
    networks:
      - dream-destiny-prod-net
    deploy:
      resources:
        limits:
          memory: 150M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── 4. Route Service ────────────────────────────────────────────────────────
  route-service:
    build:
      context: ./route-service
      dockerfile: Dockerfile
    container_name: dream-destiny-route
    restart: always
    environment:
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-*}
    networks:
      - dream-destiny-prod-net
    deploy:
      resources:
        limits:
          memory: 150M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── 5. Bus Transport Service ────────────────────────────────────────────────
  bus-service:
    build:
      context: ./transport-service/bus
      dockerfile: Dockerfile
    container_name: dream-destiny-bus
    restart: always
    networks:
      - dream-destiny-prod-net
    deploy:
      resources:
        limits:
          memory: 150M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── 6. Train Transport Service ──────────────────────────────────────────────
  train-service:
    build:
      context: ./transport-service/train
      dockerfile: Dockerfile
    container_name: dream-destiny-train
    restart: always
    volumes:
      - ./data:/app/data:ro
    environment:
      - RAILWAY_STATIONS_DATA_PATH=/app/data/railway_stations.json
      - DIVISION_HUBS_DATA_PATH=/app/data/division_hubs.json
      - STATE_CAPITALS_DATA_PATH=/app/data/state_capitals.json
      - STATION_ALIASES_DATA_PATH=/app/data/station_aliases.json
    networks:
      - dream-destiny-prod-net
    deploy:
      resources:
        limits:
          memory: 200M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── 7. Flight Transport Service ─────────────────────────────────────────────
  flight-service:
    build:
      context: ./transport-service/flight
      dockerfile: Dockerfile
    container_name: dream-destiny-flight
    restart: always
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - SERPAPI_API_KEY=${SERPAPI_API_KEY}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - HTTP_TIMEOUT=${HTTP_TIMEOUT:-30.0}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-*}
      - MAX_AIRPORT_RADIUS_KM=${MAX_AIRPORT_RADIUS_KM:-500}
      - GEOCODING_CACHE_TTL=${GEOCODING_CACHE_TTL:-86400}
    networks:
      - dream-destiny-prod-net
    deploy:
      resources:
        limits:
          memory: 180M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── 8. Planner & AI Orchestration Service ────────────────────────────────────
  planner-service:
    build:
      context: ./planner-service
      dockerfile: Dockerfile
    container_name: dream-destiny-planner
    restart: always
    environment:
      - TOURISM_SERVICE_URL=http://tourism-service:8001
      - HOTEL_SERVICE_URL=http://hotel-service:8002
      - ROUTE_SERVICE_URL=http://route-service:8003
      - TRANSPORT_BUS_SERVICE_URL=http://bus-service:8004
      - TRANSPORT_TRAIN_SERVICE_URL=http://train-service:8005
      - TRANSPORT_FLIGHT_SERVICE_URL=http://flight-service:8006
      - FLIGHT_SERVICE_URL=http://flight-service:8006
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HTTP_TIMEOUT=${HTTP_TIMEOUT:-20.0}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-60.0}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-*}
    depends_on:
      tourism-service:
        condition: service_healthy
      hotel-service:
        condition: service_healthy
      route-service:
        condition: service_healthy
      bus-service:
        condition: service_healthy
      train-service:
        condition: service_healthy
      flight-service:
        condition: service_healthy
    networks:
      - dream-destiny-prod-net
    deploy:
      resources:
        limits:
          memory: 250M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
